<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BTS Stamp">
  <!-- Circular stamp — for print on products, stickers, embroidery guide -->
  <circle cx="150" cy="150" r="140" stroke="#1e4d6b" stroke-width="2" fill="none"/>
  <circle cx="150" cy="150" r="130" stroke="#1e4d6b" stroke-width="0.5" fill="none"/>

  <!-- Top arc text -->
  <defs>
    <path id="topArc" d="M 50 150 A 100 100 0 0 1 250 150"/>
    <path id="bottomArc" d="M 250 160 A 100 100 0 0 1 50 160"/>
  </defs>
  <text font-family="'DM Sans', system-ui, sans-serif" font-size="11" fill="#1e4d6b" letter-spacing="6">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CHELSEA BY THE SEA</textPath>
  </text>
  <text font-family="'DM Sans', system-ui, sans-serif" font-size="10" fill="#9dbfb8" letter-spacing="4">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">LAGUNA BEACH · CALIFORNIA</textPath>
  </text>

  <!-- Center monogram -->
  <text x="150" y="145" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="52" font-weight="400" fill="#1e4d6b" letter-spacing="4">BTS</text>

  <!-- Wave under monogram -->
  <path d="M 95 165 Q 108 155 120 165 Q 133 175 145 165 Q 158 155 170 165 Q 183 175 195 165" stroke="#9dbfb8" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Small stars/dots as decorative elements -->
  <circle cx="150" cy="55" r="3" fill="#9dbfb8"/>
  <circle cx="150" cy="245" r="3" fill="#9dbfb8"/>
  <circle cx="55" cy="150" r="2" fill="#9dbfb8"/>
  <circle cx="245" cy="150" r="2" fill="#9dbfb8"/>
</svg>
