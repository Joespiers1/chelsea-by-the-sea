  <text x="300" y="155" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="36" font-style="italic" fill="#9dbfb8" letter-spacing="1">by the Sea</text>
  <line x1="180" y1="115" x2="270" y2="115" stroke="#9dbfb8" stroke-width="1" opacity="0.6"/>
