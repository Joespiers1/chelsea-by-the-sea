<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BTS Wave Pattern">
  <!-- Repeating wave pattern — for print backgrounds, packaging, borders -->
  <defs>
    <pattern id="wave" x="0" y="0" width="100" height="50" patternUnits="userSpaceOnUse">
      <path d="M 0 25 Q 12.5 10 25 25 Q 37.5 40 50 25 Q 62.5 10 75 25 Q 87.5 40 100 25" stroke="#9dbfb8" stroke-width="1" fill="none" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="400" height="100" fill="url(#wave)"/>
</svg>
