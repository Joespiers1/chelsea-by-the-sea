<svg viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BTS Horizontal Lockup">
  <!-- Horizontal lockup — icon + wordmark side by side, for headers/labels -->

  <!-- Icon circle -->
  <circle cx="60" cy="60" r="50" stroke="#1e4d6b" stroke-width="1.5" fill="none"/>
  <text x="60" y="55" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="400" fill="#1e4d6b" letter-spacing="2">BTS</text>
  <path d="M 30 72 Q 38 66 45 72 Q 53 78 60 72 Q 68 66 75 72 Q 83 78 90 72" stroke="#9dbfb8" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="130" y1="25" x2="130" y2="95" stroke="#9dbfb8" stroke-width="1" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="160" y="55" font-family="Georgia, 'Playfair Display', serif" font-size="48" font-weight="400" fill="#18181a" letter-spacing="1">Chelsea</text>
  <text x="160" y="90" font-family="Georgia, 'Playfair Display', serif" font-size="24" font-style="italic" fill="#1e4d6b" letter-spacing="1">by the Sea</text>
</svg>
