<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BTS Clothing Label">
  <!-- Woven label design for clothing tags — send to Apliiq/Contrado -->
  <rect width="300" height="400" fill="#f7f4ef"/>
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#1e4d6b" stroke-width="0.5"/>

  <!-- Top corner ornaments -->
  <line x1="20" y1="20" x2="50" y2="20" stroke="#9dbfb8" stroke-width="0.5"/>
  <line x1="20" y1="20" x2="20" y2="50" stroke="#9dbfb8" stroke-width="0.5"/>
  <line x1="250" y1="20" x2="280" y2="20" stroke="#9dbfb8" stroke-width="0.5"/>
  <line x1="280" y1="20" x2="280" y2="50" stroke="#9dbfb8" stroke-width="0.5"/>

  <!-- BTS monogram -->
  <text x="150" y="120" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="64" font-weight="400" fill="#1e4d6b" letter-spacing="6">BTS</text>

  <!-- Wave -->
  <path d="M 70 150 Q 90 138 110 150 Q 130 162 150 150 Q 170 138 190 150 Q 210 162 230 150" stroke="#9dbfb8" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="150" y="200" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="22" fill="#18181a" letter-spacing="1">Chelsea</text>
  <text x="150" y="225" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="16" font-style="italic" fill="#1e4d6b">by the Sea</text>

  <!-- Divider -->
  <line x1="100" y1="250" x2="200" y2="250" stroke="#9dbfb8" stroke-width="0.5"/>

  <!-- Location -->
  <text x="150" y="280" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" fill="#9dbfb8" letter-spacing="4">LAGUNA BEACH</text>
  <text x="150" y="300" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="9" fill="#9dbfb8" letter-spacing="4">CALIFORNIA</text>

  <!-- Website -->
  <text x="150" y="350" text-anchor="middle" font-family="'DM Sans', system-ui, sans-serif" font-size="8" fill="#1e4d6b" letter-spacing="3">CHELSEABTS.COM</text>

  <!-- Bottom ornaments -->
  <line x1="20" y1="380" x2="50" y2="380" stroke="#9dbfb8" stroke-width="0.5"/>
  <line x1="20" y1="350" x2="20" y2="380" stroke="#9dbfb8" stroke-width="0.5"/>
  <line x1="250" y1="380" x2="280" y2="380" stroke="#9dbfb8" stroke-width="0.5"/>
  <line x1="280" y1="350" x2="280" y2="380" stroke="#9dbfb8" stroke-width="0.5"/>
</svg>
